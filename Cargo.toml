[package]
name = "documosa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
rust-embed = { version = "8", features = ["axum", "mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = "3"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "documosa_stress"
path = "benchmarks/documosa_stress.rs"
harness = false
