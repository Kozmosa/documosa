[package]
name = "documosa-core"
version = "0.1.0"
edition = "2024"
description = "Document as a UI Protocol — core data models, operations, and permissions"

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.8", optional = true }
